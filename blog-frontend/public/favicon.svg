<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  
  <!-- Blog/Document icon -->
  <rect x="18" y="16" width="22" height="28" rx="3" fill="white" opacity="0.95"/>
  <rect x="22" y="22" width="14" height="2" rx="1" fill="#8B5CF6"/>
  <rect x="22" y="27" width="10" height="2" rx="1" fill="#C4B5FD"/>
  <rect x="22" y="32" width="12" height="2" rx="1" fill="#C4B5FD"/>
  <rect x="22" y="37" width="8" height="2" rx="1" fill="#C4B5FD"/>
  
  <!-- AI Sparkle stars -->
  <g filter="url(#glow)">
    <!-- Main sparkle -->
    <path d="M46 20 L48 24 L52 26 L48 28 L46 32 L44 28 L40 26 L44 24 Z" fill="url(#sparkleGrad)"/>
    <!-- Small sparkle 1 -->
    <path d="M50 34 L51 36 L53 37 L51 38 L50 40 L49 38 L47 37 L49 36 Z" fill="url(#sparkleGrad)" opacity="0.8"/>
    <!-- Small sparkle 2 -->
    <path d="M38 42 L39 44 L41 45 L39 46 L38 48 L37 46 L35 45 L37 44 Z" fill="url(#sparkleGrad)" opacity="0.7"/>
  </g>
  
  <!-- Subtle inner glow -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
</svg>
